[project]
name = "fragmented-sunshine-api"
version = "0.1.0"
description = "API for the Fragmented Sunshine installation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "google-genai>=1.30.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]
vision = [
  "mediapipe>=0.10.21",
  "opencv-python>=4.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "unit: isolated tests without external services",
  "integration: API and persistence tests across application components",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
